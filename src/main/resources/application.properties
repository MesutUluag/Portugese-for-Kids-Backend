spring.application.name=portugese-for-kids-backend
spring.autoconfigure.exclude=org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration,org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiMultiModalEmbeddingAutoConfiguration
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
server.forward-headers-strategy=native
spring.ai.vertex.ai.gemini.project-id=${GOOGLE_CLOUD_PROJECT}
spring.ai.vertex.ai.gemini.location=${GOOGLE_CLOUD_LOCATION:us}
spring.ai.vertex.ai.gemini.api-endpoint=${GOOGLE_CLOUD_API_ENDPOINT:aiplatform.us.rep.googleapis.com}
spring.ai.vertex.ai.gemini.chat.options.model=gemini-3.1-flash-lite
spring.ai.vertex.ai.gemini.chat.options.temperature=0.4
spring.ai.vertex.ai.gemini.chat.options.top-k=40
spring.ai.vertex.ai.gemini.chat.options.top-p=0.85
spring.ai.vertex.ai.gemini.transport=grpc
gemini.image.api-key=${GEMINI_API_KEY:}
gemini.image.enabled=${GEMINI_IMAGE_ENABLED:false}
gemini.image.cooldown-minutes=15
pollinations.connect-timeout-seconds=5
pollinations.request-timeout-seconds=15
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173,https://mesutuluag.github.io}
rate-limit.enabled=true
rate-limit.daily-limit=250
image.jpeg.quality=0.60
image.cache.similarity-threshold=0.55
image.cache.max-entries=1000
image.validation.max-prompt-length=500
image.validation.min-dimension=64
image.validation.max-dimension=1024
story.history.max-items=10
story.validation.max-prompt-length=300
story.validation.max-previous-sentence-length=300
story.validation.max-history-item-length=200
# GCS-backed image cache
image.cache.gcs.enabled=true
image.cache.gcs.async-warmup=true
image.cache.gcs.max-concurrent-reads=32
image.cache.gcs.bucket=portugese-kids-image-cache
image.cache.gcs.prefix=image-cache
